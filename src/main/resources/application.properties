spring.application.name=Webserver
app.display-name=${APP_DISPLAY_NAME:Webserver}
spring.datasource.url=jdbc:sqlite:./data/webserver.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
app.bootstrap-admin.username=admin
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
mods.api.enabled=${MODS_API_ENABLED:false}
mods.api.port=${MODS_API_PORT:8081}
mods.api.token-sha256=${MODS_API_TOKEN_SHA256:}
# Connector identity is the research API trust boundary; never rewrite it from headers.
server.forward-headers-strategy=NONE
